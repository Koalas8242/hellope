<!DOCTYPE html>

<style>

<script>
/* ============================================================
   0. 版本与数据层（含旧版迁移）
   审计修正：KEY/KEY_V2 改为 STORAGE_KEY/STORAGE_KEY_V2，消除“密钥”歧义
============================================================ */
const VERSION = "2.0";
const STORAGE_KEY = "rural_pe_teacher_workbench_v1";
const STORAGE_KEY_V2 = "rural_pe_teacher_workbench_v2";
const defaultState = {
  meta: { version: VERSION, createdAt: new Date().toISOString(), lastBackupAt: "" },
  todos: [],
  lessonPlans: [],
  semesterPlans: [],
  bigBreakPlans: [],
  students: [],
  fitnessRecords: [],
  trainingPlans: [],
  safetyChecks: [],
  equipment: [],
  equipmentLogs: [],
  workload: [],
  weeklyTimetable: [],
  growth: [],
  observations: []
};

let state = loadState();
let activeTab = "workbench";
let currentGeneratedLesson = null;
let currentGeneratedBigBreak = null;
let currentGeneratedSemester = null;
let lastDeleted = null;

function loadState() {
  try {
    const rawV2 = localStorage.getItem(STORAGE_KEY_V2);
    if (rawV2) {
      const s = JSON.parse(rawV2);
      return normalize(s);
    }
    const rawV1 = localStorage.getItem(STORAGE_KEY);
    if (rawV1) {
      const old = JSON.parse(rawV1);
      const migrated = normalize(Object.assign({}, JSON.parse(JSON.stringify(defaultState)), old));
      migrated.meta.version = VERSION;
      migrated.meta.migratedFromV1 = true;
      localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(migrated));
      return migrated;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(defaultState));
}

/* 审计修正：白名单逐键复制，防止导入 JSON 的原型污染 */
function normalize(s) {
  const out = JSON.parse(JSON.stringify(defaultState));
  if (!s || typeof s !== "object") return out;
  const allowed = Object.keys(defaultState);
  for (const k of allowed) {
    if (k === "meta") {
      const m = (s.meta && typeof s.meta === "object") ? s.meta : {};
      out.meta = {
        version: VERSION,
        createdAt: (typeof m.createdAt === "string" && m.createdAt) || out.meta.createdAt,
        lastBackupAt: (typeof m.lastBackupAt === "string" && m.lastBackupAt) || "",
        migratedFromV1: !!m.migratedFromV1
      };
    } else if (Array.isArray(defaultState[k])) {
      out[k] = Array.isArray(s[k]) ? s[k] : [];
    }
  }
  return out;
}

function saveState() {
  state.meta.version = VERSION;
  localStorage.setItem(STORAGE_KEY_V2, JSON.stringify(state));
  updateStatus();
}
function updateStatus() {
  const el = document.getElementById("status");
  if (el) el.textContent = "已保存 " + new Date().toLocaleTimeString("zh-CN", {hour:"2-digit",minute:"2-digit"});
  const v = document.getElementById("versionLine");
  if (v) v.textContent = "v" + VERSION + " · 离线可用 · 数据本机";
}
function uid() { return Date.now().toString(36) + Math.random().toString(16).slice(2); }
function esc(v) { return String(v ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function todayISO() { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthKey(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function startOfWeek(d=new Date()){ const x=new Date(d); const day=(x.getDay()+6)%7; x.setDate(x.getDate()-day); x.setHours(0,0,0,0); return x; }
function numOrNull(v){ if(v===""||v===null||v===undefined) return null; const n=Number(v); return Number.isFinite(n)?n:null; }
function daysSince(iso){ if(!iso) return 999; const d=new Date(iso+"T00:00:00"); return Math.floor((Date.now()-d.getTime())/86400000); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2000); }
function download(filename, content, type="text/plain;charset=utf-8"){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function csvText(rows){ return "\uFEFF"+rows.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n"); }

function gradeOptions(){ let s=""; for(let i=1;i<=9;i++) s+=`<option value="${i}年级">${i}年级</option>`; return s; }
function topicOptions(){ return Object.entries(templates).map(([k,v])=>`<option value="${k}">${esc(v.name)}</option>`).join(""); }
function studentOptions(){

  return state.students.map(s=>`<option value="${s.id}">${esc(s.name)}（${esc(s.grade)}${esc(s.className)}）</option>`).join("");

function specialReminderHtml() {
  const special = state.students.filter(s => s.special && s.special !== "无");
  if (!special.length) return "";
  return `<div class="reminder no-print"><strong>特异体质/免测提醒：</strong>${special.map(s => `${esc(s.name)}（${esc(s.special)}）`).join("、")}。安排活动前请确认见习/免测要求，并在教案中标注。</div>`;
}

const views = {
  workbench: renderWorkbench, lesson: renderLesson, bigbreak: renderBigBreak,
  fitness: renderFitness, training: renderTraining, observe: renderObserve,
  safety: renderSafety, workload: renderWorkload, growth: renderGrowth,
  about: renderAbout
};
function render() {
  document.getElementById("app").innerHTML = specialReminderHtml() + views[activeTab]();
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === activeTab));
  updateStatus();
}
document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { activeTab = b.dataset.tab; render(); }));

function renderWorkbench() {
  const ws = startOfWeek();
  const weekMinutes = state.workload.filter(w => w.date && new Date(w.date+"T00:00:00") >= ws).reduce((a,w)=>a+(Number(w.minutes)||0),0);
  const pending = state.todos.filter(t=>!t.done).length;
  const mk = monthKey();
  const monthMinutes = state.workload.filter(w=>w.date && w.date.startsWith(mk)).reduce((a,w)=>a+(Number(w.minutes)||0),0);
  const backupWarn = daysSince(state.meta.lastBackupAt) >= 7 && (state.students.length || state.fitnessRecords.length || state.workload.length);
  const todoRows = state.todos.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))).map(t=>`
    <tr>
      <td><input type="checkbox" ${t.done?"checked":""} onchange="toggleTodo('${t.id}')" style="min-width:20px;min-height:20px"></td>
      <td style="${t.done?"text-decoration:line-through;color:#888":""}">${esc(t.text)}</td>
      <td>${esc(t.date)}</td>
      <td><button class="danger" style="padding:4px 7px;font-size:11px" onclick="delWithUndo('todos','${t.id}')">删</button></td>
    </tr>`).join("");
  return `
  ${backupWarn?`<div class="reminder no-print"><strong>备份提醒：</strong>距上次导出已超过7天，建议到“工作台→数据管理”导出备份，防止清理缓存或换手机导致数据丢失。<button class="secondary" style="margin-left:6px;padding:4px 8px;font-size:12px" onclick="exportJSON()">立即导出</button></div>`:""}
  <div class="card">
    <h2>本周概览</h2>
    <div class="grid">
      <div class="stat"><div class="small">未完成待办</div><strong>${pending}</strong></div>
      <div class="stat"><div class="small">本周工作量</div><strong>${weekMinutes}</strong><div class="small">分钟</div></div>
      <div class="stat"><div class="small">本月工作量</div><strong>${monthMinutes}</strong><div class="small">分钟</div></div>
      <div class="stat"><div class="small">学生 / 测试记录</div><strong>${state.students.length} / ${state.fitnessRecords.length}</strong></div>
      <div class="stat"><div class="small">观摩笔记</div><strong>${state.observations.length}</strong></div>
    </div>
  </div>
  <div class="card">
    <h2>待办清单</h2>
    <form onsubmit="return addTodo(event)">
      <div class="row">
        <div><label>事项</label><input id="todoText" required placeholder="如：上报测试数据、检查跳绳数量"></div>
        <div><label>日期</label><input type="date" id="todoDate" value="${todayISO()}"></div>
      </div>
      <div class="actions"><button>添加待办</button></div>
    </form>
    ${state.todos.length?`<table><tr><th>完成</th><th>事项</th><th>日期</th><th></th></tr>${todoRows}</table>`:`<p class="empty">暂无待办。</p>`}
  </div>
  <div class="card">
    <h2>今日提示</h2>
    <ul>
      <li><strong>课前安全：</strong>检查场地石块、坑洼、湿滑；询问身体不适；检查鞋带和口袋硬物；确认特异体质学生见习安排。</li>
      <li><strong>运动负荷：</strong>平均心率可参考140—160次/分，观察面色、呼吸和自述，及时降强度。</li>
      <li><strong>器材不足：</strong>优先“循环站+分组轮换+自制替代”，不要因器材少就放羊。</li>
      <li><strong>复式班/大班额：</strong>用A/B任务卡、小组长安全员、定点巡回，减少无效排队。</li>
      <li><strong>留痕：</strong>大课间、训练、测试、走教交通都记入“工作量”；观摩后记一条笔记，比只看不记有用。</li>
    </ul>
  </div>
  <div class="card no-print">
    <h2>数据管理</h2>
    <div class="actions">
      <button onclick="exportJSON()">导出备份 JSON</button>
      <label class="inline-btn" style="text-decoration:none">导入备份<input type="file" id="importFile" accept=".json" onchange="importJSON(event)" style="display:none"></label>
      <button class="danger" onclick="resetAll()">清空全部数据</button>
    </div>
    <p class="small">换电脑、清理浏览器或期末归档前，请先导出JSON。导入会覆盖当前数据。学生信息仅保存在本机，导出文件不要随意发群。</p>
  </div>`;
}
function addTodo(e){ e.preventDefault(); const text=document.getElementById("todoText").value.trim(); if(!text) return false;
  state.todos.push({id:uid(),text,date:document.getElementById("todoDate").value||todayISO(),done:false}); saveState(); render(); return false; }
function toggleTodo(id){ const t=state.todos.find(x=>x.id===id); if(t) t.done=!t.done; saveState(); render(); }

/* ============================================================
   6. 撤销删除
============================================================ */
function delWithUndo(collection,id){
  const arr=state[collection]; const idx=arr.findIndex(x=>x.id===id); if(idx<0) return;
  lastDeleted={collection,item:arr[idx],index:idx};
  arr.splice(idx,1); saveState(); render();
  toast("已删除，10秒内可撤销");
  setTimeout(()=>{ if(lastDeleted && lastDeleted.item.id===id){ lastDeleted=null; } },10000);
}
function undoDelete(){
  if(!lastDeleted) return toast("没有可撤销的删除");
  const {collection,item,index}=lastDeleted;
  state[collection].splice(Math.min(index,state[collection].length),0,item);
  lastDeleted=null; saveState(); render(); toast("已恢复");
}

function generateSemester(e){
  e.preventDefault();
  const grade=document.getElementById("sGrade").value; const term=document.getElementById("sTerm").value;
  const weeks=Math.max(10,Math.min(24,Number(document.getElementById("sWeeks").value)||20));
  const perWeek=Number(document.getElementById("sPerWeek").value)||3;
  const topics=Object.keys(templates).filter(k=>k!=="health");
  const rows=[]; let ti=0;
  for(let w=1; w<=weeks; w++){
    let note="";
    if(w===1) note="安全常规/摸底";
    else if(w===Math.ceil(weeks/2)) note="期中展示/体质测试";
    else if(w===weeks) note="单元评价/学期总结";
    const topic=templates[topics[ti%topics.length]].name;
    rows.push({week:w,topic,lessons:perWeek,note});
    if(w%3===0) ti++;
  }
  const lines=rows.map(r=>`第${r.week}周 | ${r.topic} | ${r.lessons}课时 | ${r.note}`).join("\n");
  const content=`【学期教学进度表】
年级：${grade}    学期：${term}    总周数：${weeks}    每周课时：${perWeek}

周次 | 主教材/单元 | 课时 | 备注
${lines}

说明：本表按乡村学校常见节奏生成，可按实际校历、节假日和师资情况调整。跨学科主题学习建议每学期安排不少于总课时10%，可结合“乡土体育/跨学科”项目落实。`;
  currentGeneratedSemester={id:uid(),title:`${grade}${term} 进度表`,created:new Date().toLocaleString("zh-CN"),content,rows};
  document.getElementById("semesterOutput").innerHTML=`<h3>生成结果</h3><pre>${esc(content)}</pre><button class="secondary" onclick="saveSemester()">保存进度表</button>`;
  return false;
}
function saveSemester(){
  if(!currentGeneratedSemester) return toast("请先生成进度表");
  state.semesterPlans.push(currentGeneratedSemester); saveState(); render(); toast("进度表已保存");
}
function exportSemesterCSV(){
  if(!currentGeneratedSemester || !currentGeneratedSemester.rows) return toast("请先生成进度表");
  const rows=[["周次","主教材/单元","课时","备注"]];
  currentGeneratedSemester.rows.forEach(r=>rows.push([r.week,r.topic,r.lessons,r.note]));
  download("学期教学进度表.csv",csvText(rows),"text/csv;charset=utf-8");
}
function savedPlansHtml(collection){

function addTimetable(e){
  e.preventDefault();
  state.weeklyTimetable.push({id:uid(),day:document.getElementById("ttDay").value,period:document.getElementById("ttPeriod").value.trim(),className:document.getElementById("ttClass").value.trim(),type:document.getElementById("ttType").value,minutes:Number(document.getElementById("ttMinutes").value)||40});
  saveState(); render(); toast("课表项已添加"); return false;
}
function generateWorkloadFromTimetable(){
  if(!state.weeklyTimetable.length) return toast("请先添加周课表");
  const ws=startOfWeek();
  const dayMap={"周一":0,"周二":1,"周三":2,"周四":3,"周五":4};
  let n=0;
  state.weeklyTimetable.forEach(t=>{
    const d=new Date(ws); d.setDate(ws.getDate()+(dayMap[t.day]??0));
    const iso=d.toISOString().slice(0,10);
    if(state.workload.some(w=>w.date===iso && w.type===t.type && w.note===`${t.className} ${t.period}`.trim())) return;
    state.workload.push({id:uid(),date:iso,type:t.type,minutes:t.minutes,note:`${t.className} ${t.period}`.trim()}); n++;
  });
  saveState(); render(); toast(`已生成本周 ${n} 条工作量记录`);
}
function addWorkload(e){
  e.preventDefault();
  state.workload.push({id:uid(),date:document.getElementById("wDate").value||todayISO(),type:document.getElementById("wType").value,minutes:Number(document.getElementById("wMinutes").value)||0,note:document.getElementById("wNote").value.trim()});
  saveState(); render(); toast("工作量已记录"); return false;
}
function exportWorkloadCSV(){
  const rows=[["日期","类型","分钟","备注"]];
  state.workload.forEach(w=>rows.push([w.date,w.type,w.minutes,w.note]));
  download("工作量记录.csv",csvText(rows),"text/csv;charset=utf-8");
}

function exportJSON(){
  state.meta.lastBackupAt=todayISO();
  download("乡村体育教师工作台备份_v2.json",JSON.stringify(state,null,2),"application/json;charset=utf-8");
  saveState(); updateStatus(); toast("备份已导出");
}
function importJSON(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      if(!confirm("导入将覆盖当前数据，确定继续？")) return;
      state=normalize(parsed); saveState(); render(); toast("导入成功");
    }catch(e){ alert("导入失败：不是有效的JSON备份。"); }
    finally{ event.target.value=""; }
  };
  reader.readAsText(file,"utf-8");
}
function resetAll(){
  if(!confirm("确定清空全部数据？建议先导出备份。")) return;
  if(!confirm("再次确认：清空后无法恢复。")) return;
  state=JSON.parse(JSON.stringify(defaultState)); saveState(); render(); toast("已清空");
}
